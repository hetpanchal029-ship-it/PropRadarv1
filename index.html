<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PropRadar</title><style>
:root{--bg:#09090b;--p:#111114;--p2:#18181b;--bd:#27272a;--tx:#e4e4e7;--mu:#8b8b96;--g:#34d399;--r:#fb7185;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.45}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:20;background:rgba(9,9,11,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.hin{max-width:1200px;margin:auto;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.logo{font-size:20px;font-weight:800;letter-spacing:-.5px}.logo b{color:var(--g)}
.sw{position:relative;flex:1;min-width:220px}
#q{width:100%;background:var(--p2);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;outline:0}#q:focus{border-color:var(--g)}
#sug{position:absolute;left:0;right:0;top:44px;background:var(--p2);border:1px solid var(--bd);border-radius:10px;overflow:hidden;display:none}
#sug div{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--bd)}#sug div:hover{background:#222226}#sug small{color:var(--mu)}
nav{display:flex;gap:6px}.pg{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--mu);font-weight:600}.pg.on{background:var(--p2);color:var(--g)}
main{max-width:1200px;margin:auto;padding:16px 16px 60px}
.hero{padding:10px 0 4px}.hero h1{margin:0 0 4px;font-size:26px;letter-spacing:-.6px}.hero p{margin:0;color:var(--mu)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0}.tabs button{flex:none;background:var(--p);border:1px solid var(--bd);border-radius:999px;padding:7px 14px;color:var(--mu)}
.tabs button.on{border-color:var(--g);color:var(--g);background:rgba(52,211,153,.08)}
.bar{display:flex;justify-content:space-between;align-items:center;color:var(--mu);margin-bottom:12px}
.seg button{background:var(--p);border:1px solid var(--bd);padding:6px 14px;color:var(--mu)}.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}.seg .on{background:var(--p2);color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--p);border:1px solid var(--bd);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}.card:hover{border-color:#3f3f46}
.ct{display:flex;justify-content:space-between;align-items:flex-start}.ct h3{margin:0;font-size:17px}.ct small,.ver{color:var(--mu);font-size:12px}
.tag{display:inline-block;padding:2px 9px;border-radius:6px;font-size:11px;font-weight:600;background:rgba(52,211,153,.12);color:var(--g)}.tag.b{background:rgba(96,165,250,.12);color:#93c5fd}.tag.x{background:rgba(251,113,133,.14);color:var(--r)}
.mini{padding:0;gap:4px}.mini button{border-radius:8px;padding:6px 4px;flex:1;font-size:12px}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--p2);border-radius:10px;padding:10px}.kv span{display:block;color:var(--mu);font-size:11px}.kv b{font-size:14px}.g{color:var(--g)}
.bd{display:flex;flex-wrap:wrap;gap:5px;min-height:22px}
.cf{display:flex;justify-content:space-between;align-items:center}.cf label{color:var(--mu);display:flex;gap:6px;align-items:center}
.btn{background:var(--g);color:#052e21;border:0;border-radius:8px;padding:8px 12px;font-weight:700}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:820px}
th{text-align:left;color:var(--mu);font-size:12px;font-weight:600;padding:10px;background:var(--p);white-space:nowrap}td{padding:10px;border-top:1px solid var(--bd);white-space:nowrap}tr.rw:hover td{background:var(--p)}
.link{background:none;border:0;padding:0;font-weight:700;text-align:left}.link:hover{color:var(--g)}
.tray{background:var(--p);border:1px solid rgba(52,211,153,.4);border-radius:12px;padding:12px;margin-bottom:14px;overflow-x:auto}.tray table{min-width:480px}.tray td,.tray th{padding:6px 10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:40;display:flex;justify-content:flex-end}
.dr{width:100%;max-width:480px;height:100%;overflow-y:auto;background:var(--p);border-left:1px solid var(--bd);padding:20px;padding-top:max(20px,env(safe-area-inset-top));padding-bottom:max(30px,env(safe-area-inset-bottom))}
.dr h2{margin:0}.cl{float:right;background:none;border:0;font-size:28px;color:var(--mu);line-height:1}
.dr h4{margin:20px 0 6px;color:var(--g);font-size:11px;text-transform:uppercase;letter-spacing:.1em}
.row{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--bd)}.row span:first-child{color:var(--mu)}.row span:last-child{text-align:right}.bad{color:var(--r)}
.warn{background:rgba(251,113,133,.1);border:1px solid rgba(251,113,133,.35);color:#fda4af;padding:10px 12px;border-radius:10px;margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.chips button{background:var(--p2);border:1px solid var(--bd);border-radius:8px;padding:6px 12px}.chips .on{border-color:var(--g);color:var(--g)}
.dr ul{padding-left:0;list-style:none;margin:8px 0}.dr li{padding:4px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}@media(max-width:760px){.two{grid-template-columns:1fr}}
.f{display:block;margin-bottom:14px}.f span{display:block;color:var(--mu);margin-bottom:5px}.f select{width:100%;background:var(--p2);border:1px solid var(--bd);border-radius:8px;padding:10px}.f input[type=range]{width:100%;accent-color:#10b981}
.res{background:var(--p);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px}.res b{font-size:16px}
.step{background:var(--p);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px}.step h3{margin:0 0 4px;font-size:15px}.step p{margin:0;color:var(--mu)}
.foot{color:var(--mu);font-size:12px;margin-top:32px}

.seg.big{display:flex;margin:14px 0 4px}.seg.big button{flex:1;padding:12px;font-weight:700;font-size:15px}
.star{background:none;border:0;font-size:22px;line-height:1;color:var(--mu);padding:0 4px}.star.on{color:#fbbf24}
.grp{border-top:1px solid var(--bd);padding-top:8px}.gt{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--g);margin-bottom:4px}
.mrow{display:flex;align-items:center;gap:8px;padding:4px 0}.mrow .mu{color:var(--mu);font-size:12px;flex:1;text-align:right}.mrow input{accent-color:#10b981}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin:10px 0}.pgrid button{background:var(--p2);border:1px solid var(--bd);border-radius:10px;padding:8px;text-align:center}.pgrid button span{display:block;color:var(--mu);font-size:12px}.pgrid .on{border-color:var(--g)}.pgrid .on b{color:var(--g)}
.dr table{min-width:0;font-size:13px}.dr td,.dr th{padding:7px 6px}.dr tr.sel td{background:rgba(52,211,153,.08)}.dr tr[data-a]{cursor:pointer}
.big{font-size:26px;font-weight:800;color:var(--g)}.lk{color:var(--g);text-decoration:none;font-size:13px}
.tag.w{background:rgba(251,191,36,.14);color:#fbbf24}.tag.n{background:#27272a;color:#a1a1aa}.note{color:var(--mu);font-size:12px}

.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:14px 0}.stat{background:var(--p);border:1px solid var(--bd);border-radius:10px;padding:10px}.stat span{display:block;color:var(--mu);font-size:11px}.stat b{font-size:20px}
.sec{margin:26px 0 8px;font-size:15px}.sec small{color:var(--mu);font-weight:400;margin-left:6px}
.empty{color:var(--mu);padding:16px;border:1px dashed var(--bd);border-radius:10px;text-align:center}
.err{background:rgba(251,113,133,.1);border:1px solid rgba(251,113,133,.35);color:#fda4af;padding:14px;border-radius:10px;margin:16px 0}
.spin{color:var(--mu);text-align:center;padding:60px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}.mbox{background:var(--p);border:1px solid var(--bd);border-radius:14px;padding:22px;width:100%;max-width:380px}

.tag.ok{background:rgba(52,211,153,.14);color:var(--g)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.sr{position:absolute;left:-9999px}
.tw table{min-width:640px}.wide table{min-width:900px}
@media(max-width:600px){main{padding:12px 12px 60px}.hero h1{font-size:22px}.kv{grid-template-columns:repeat(2,1fr)}}

.cmpt{min-width:640px;border-collapse:separate;border-spacing:0}.cmpt th{position:sticky;top:0;z-index:2;background:var(--p2);text-align:left;vertical-align:top;padding:10px 12px;min-width:170px;border-bottom:1px solid var(--bd)}
.cmpt th small{display:block;color:var(--g);font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase}.cmpt th b{display:block;color:var(--tx)}.cmpt th span{display:block;color:var(--mu);font-weight:500;font-size:12px}
.cmpt td{padding:9px 12px;border-bottom:1px solid var(--bd);white-space:normal;vertical-align:top;word-break:break-word}.cmpt td.lb{position:sticky;left:0;z-index:1;background:var(--p);color:var(--mu);min-width:130px;font-weight:600}.cmpt th:first-child{left:0;z-index:3}
.cmpt tr.dif td:not(.lb){background:rgba(52,211,153,.06)}.cmpt tr.dif td.lb{box-shadow:inset 3px 0 0 var(--g)}
